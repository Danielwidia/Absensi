<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Absensi - Sekolah Kristen Dorkas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  
  <style>
    .animate-pulse-fast { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .table-container::-webkit-scrollbar, .tab-nav::-webkit-scrollbar { height: 6px; }
    .table-container::-webkit-scrollbar-track, .tab-nav::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    .table-container::-webkit-scrollbar-thumb, .tab-nav::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    
    .glass-gradient-top {
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.9) 35%, rgba(255, 255, 255, 0.98) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    
    @keyframes floatSlow { 0% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-18px) scale(1.03); } 100% { transform: translateY(0px) scale(1); } }
    .animate-float-slow { animation: floatSlow 7s ease-in-out infinite; }
    .realistic-sun { background: radial-gradient(circle at 30% 30%, #fff700, #ff8800); box-shadow: 0 0 40px 10px rgba(255, 204, 0, 0.4); animation: floatSlow 6s ease-in-out infinite; }
    .realistic-moon { background: radial-gradient(circle at 35% 35%, #ffffff, #cfd8dc); box-shadow: inset -12px -4px 0px 2px rgba(255,255,255,0.8); animation: floatSlow 8s ease-in-out infinite; }
  </style>
</head>

<body id="main-body" class="bg-gray-100 min-h-screen font-sans py-10 px-4 transition-colors duration-1000 relative overflow-x-hidden">
  
  <div id="theme-decorations" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>
  
  <div class="max-w-md mx-auto p-8 glass-gradient-top rounded-3xl shadow-2xl relative z-10 overflow-hidden transition-all duration-500" id="app-container">
    <div class="absolute -top-16 -right-16 w-32 h-32 bg-blue-100 rounded-full opacity-50 blur-2xl pointer-events-none"></div>
    <div class="absolute -bottom-16 -left-16 w-32 h-32 bg-orange-100 rounded-full opacity-50 blur-2xl pointer-events-none"></div>

    <div class="text-center mb-8 relative z-10">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 text-white rounded-2xl shadow-lg mb-4">
        <i class="fa-solid fa-school text-3xl"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-gray-800 tracking-tight">Sekolah Kristen Dorkas</h1>
      <p class="text-sm text-gray-500 mt-1">Sistem Absensi Digital</p>
    </div>

    <!-- LOGIN PAGE -->
    <div id="login-page" class="relative z-10">
      <div class="space-y-4">
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-user text-gray-400"></i></div>
          <input type="text" id="log-user" placeholder="Username" class="w-full pl-10 pr-4 py-3 bg-white/80 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
        </div>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-lock text-gray-400"></i></div>
          <input type="password" id="log-pass" placeholder="Password" class="w-full pl-10 pr-10 py-3 bg-white/80 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
          <div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer" onclick="togglePasswordVisibility()"><i id="toggle-icon" class="fa-solid fa-eye-slash text-gray-400 hover:text-gray-600"></i></div>
        </div>
        <div class="flex items-center justify-between mt-2">
          <label class="flex items-center text-sm text-gray-600 cursor-pointer hover:text-blue-600">
            <input type="checkbox" id="remember-me" class="mr-2 w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 cursor-pointer">
            <span class="font-medium">Ingat saya di perangkat ini</span>
          </label>
        </div>
        <button id="btn-login-submit" onclick="doLogin()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all mt-2">Masuk <i class="fa-solid fa-arrow-right ml-2"></i></button>
      </div>
      <p class="mt-6 text-sm text-center text-gray-600">Belum punya akun? <span onclick="showPage('register-page')" class="text-blue-600 cursor-pointer hover:underline font-bold">Daftar di sini</span></p>
    </div>

    <!-- REGISTER PAGE -->
    <div id="register-page" class="hidden relative z-10">
      <div class="space-y-3">
        <input type="text" id="reg-nama" placeholder="Nama Lengkap" class="w-full px-4 py-3 bg-white/80 border border-gray-200 rounded-xl outline-none">
        <input type="text" id="reg-user" placeholder="Username" class="w-full px-4 py-3 bg-white/80 border border-gray-200 rounded-xl outline-none">
        <input type="password" id="reg-pass" placeholder="Password" class="w-full px-4 py-3 bg-white/80 border border-gray-200 rounded-xl outline-none">
        <select id="reg-role" class="w-full px-4 py-3 bg-white/80 border border-gray-200 rounded-xl outline-none text-gray-600">
          <option value="Siswa">Siswa</option>
          <option value="Guru/Karyawan KB-TK">Guru/Karyawan KB-TK</option>
          <option value="Guru/Karyawan SD">Guru/Karyawan SD</option>
          <option value="Guru/Karyawan SMP">Guru/Karyawan SMP</option>
        </select>
        <button onclick="doRegister()" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold py-3 rounded-xl shadow-lg mt-2">Daftar Akun Baru</button>
        <button onclick="showPage('login-page')" class="w-full bg-white/80 text-gray-700 font-semibold py-3 rounded-xl hover:bg-white">Kembali ke Login</button>
      </div>
    </div>
    
    <!-- ADMIN PAGE -->
    <div id="admin-page" class="hidden relative z-10 w-full">
      <div class="flex items-center gap-3 mb-6 pb-4 border-b border-gray-100">
        <div class="w-12 h-12 rounded-full bg-purple-100 flex items-center justify-center text-purple-600"><i class="fa-solid fa-user-shield text-xl"></i></div>
        <div><h2 class="text-lg font-bold text-gray-800">Panel Admin</h2><p class="text-xs text-gray-500">Pengaturan & Laporan Absensi</p></div>
      </div>
      
      <div class="bg-indigo-50/95 p-5 rounded-2xl border border-indigo-100 mb-4">
        <h3 class="font-bold text-indigo-800 mb-3"><i class="fa-solid fa-file-invoice"></i> Filter Data Laporan</h3>
        <div class="grid grid-cols-2 gap-3 mb-4">
          <div><label class="text-xs font-semibold text-gray-600 uppercase">Dari Tanggal</label><input type="date" id="filter-start" class="w-full mt-1 px-3 py-2 bg-white border rounded-lg text-sm"></div>
          <div><label class="text-xs font-semibold text-gray-600 uppercase">Sampai Tanggal</label><input type="date" id="filter-end" class="w-full mt-1 px-3 py-2 bg-white border rounded-lg text-sm"></div>
        </div>
        <div class="flex gap-2">
          <button id="btn-lihat" onclick="lihatData()" class="w-1/2 bg-indigo-600 text-white font-semibold py-2 rounded-xl text-sm shadow-md">Tampilkan</button>
          <button id="btn-download" onclick="downloadExcel()" class="w-1/2 bg-green-600 text-white font-semibold py-2 rounded-xl text-sm shadow-md hidden">Unduh Excel</button>
        </div>
      </div>

      <div id="data-preview-section" class="hidden mb-6 bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm">
        <div class="flex border-b bg-gray-50 overflow-x-auto whitespace-nowrap tab-nav">
          <button id="tab-btn-siswa" onclick="switchTab('siswa')" class="px-5 py-3 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 bg-white">Siswa</button>
          <button id="tab-btn-kbtk" onclick="switchTab('kbtk')" class="px-5 py-3 text-sm font-bold text-gray-500">KB-TK</button>
          <button id="tab-btn-sd" onclick="switchTab('sd')" class="px-5 py-3 text-sm font-bold text-gray-500">SD</button>
          <button id="tab-btn-smp" onclick="switchTab('smp')" class="px-5 py-3 text-sm font-bold text-gray-500">SMP</button>
        </div>
        <div class="p-4 table-container overflow-x-auto"><div id="tabel-siswa"></div><div id="tabel-kbtk" class="hidden"></div><div id="tabel-sd" class="hidden"></div><div id="tabel-smp" class="hidden"></div></div>
      </div>

      <div class="bg-blue-50/95 p-5 rounded-2xl border border-blue-100 mb-6">
        <h3 class="font-bold text-blue-800 mb-3"><i class="fa-solid fa-map-location-dot"></i> Pengaturan Aplikasi</h3>
        <label class="text-xs font-semibold text-gray-600 uppercase">Lokasi Sekolah</label>
        <div class="grid grid-cols-2 gap-2 mb-3">
          <input type="text" id="admin-lat" placeholder="Latitude" class="w-full px-3 py-2 bg-white border rounded-lg text-sm">
          <input type="text" id="admin-lon" placeholder="Longitude" class="w-full px-3 py-2 bg-white border rounded-lg text-sm">
        </div>
        <label class="text-xs font-semibold text-gray-600 uppercase">Jadwal Pengingat (Senin - Sabtu)</label>
        <div class="overflow-x-auto mt-2 mb-4">
          <table class="w-full text-[10px] text-left border border-gray-200 bg-white rounded-lg">
            <thead class="bg-gray-100"><tr><th class="p-2 border">Hari</th><th class="p-2 border">Masuk</th><th class="p-2 border">Pulang</th></tr></thead>
            <tbody id="jadwal-admin-body"></tbody>
          </table>
        </div>
        <button onclick="simpanPengaturan()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md transition-all">Simpan Pengaturan</button>
      </div>
      <button onclick="logout()" class="w-full bg-red-50 text-red-600 font-bold py-3 rounded-xl border border-red-100">Keluar</button>
    </div>

    <!-- DASHBOARD PAGE -->
    <div id="dashboard-page" class="hidden relative z-10">
      <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-100">
        <div><h2 id="greeting" class="text-xl font-extrabold text-gray-800"></h2><p class="text-sm text-gray-500">Siap untuk absen hari ini?</p></div>
        <div class="w-12 h-12 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 shadow-inner"><i class="fa-solid fa-user-astronaut text-xl"></i></div>
      </div>
      <div id="gps-box" class="bg-blue-50/95 border border-blue-100 p-3 rounded-xl flex items-center gap-3 mb-6 transition-all duration-300">
        <div id="gps-icon-bg" class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-500 shrink-0"><i id="gps-icon" class="fa-solid fa-location-crosshairs animate-pulse-fast"></i></div>
        <span id="gps-status" class="text-sm font-semibold text-blue-700 leading-tight">Cek Lokasi...</span>
      </div>
      <div id="camera-box" class="mb-6 hidden">
        <div class="bg-indigo-50 border-2 border-dashed border-indigo-300 rounded-2xl p-6 text-center mb-3">
          <p class="text-sm font-semibold text-indigo-800 mb-3" id="kamera-instruksi">Ambil foto selfie</p>
          <input type="file" id="foto-input" accept="image/*" capture="user" class="hidden" onchange="previewFoto(event)">
          <label for="foto-input" class="cursor-pointer inline-flex items-center gap-2 bg-indigo-600 text-white font-bold py-3 px-6 rounded-xl"><i class="fa-solid fa-camera"></i> Buka Kamera HP</label>
          <img id="foto-preview" class="mt-4 mx-auto max-h-56 rounded-xl shadow-md hidden" src="" alt="Preview">
        </div>
        <button id="btn-snap" onclick="simpanAbsen()" class="w-full bg-green-600 text-white font-bold p-4 rounded-xl shadow-lg hidden">Simpan Absen</button>
        <button onclick="batalAbsen()" class="w-full mt-3 bg-white border border-gray-300 text-gray-700 font-bold p-3 rounded-xl">Batal</button>
      </div>
      <div id="tombol-absen-box" class="grid grid-cols-2 gap-3 mb-6">
        <button id="btn-masuk" class="py-3 px-4 rounded-xl shadow-md font-bold text-sm text-white"></button>
        <button id="btn-pulang" class="py-3 px-4 rounded-xl shadow-md font-bold text-sm text-white"></button>
      </div>
      <div class="bg-gray-50/90 rounded-2xl border border-gray-100 mb-6 overflow-hidden shadow-sm">
        <button onclick="toggleFormIzin()" class="w-full p-4 flex items-center justify-between bg-gray-100/90 text-gray-700 font-bold text-sm">
          <span class="flex items-center gap-2"><i class="fa-solid fa-envelope-open-text"></i> Form Izin</span>
          <i id="izin-icon" class="fa-solid fa-chevron-down"></i>
        </button>
        <div id="izin-content" class="p-5 hidden space-y-3">
          <input type="text" id="ket-izin" placeholder="Alasan Izin" class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none text-sm">
          <button id="btn-izin" onclick="kirimIzin()" class="w-full bg-gray-700 text-white font-bold py-3 rounded-xl">Kirim Izin</button>
        </div>
      </div>
      <button onclick="logout()" class="w-full bg-red-50 text-red-600 font-bold py-3 rounded-xl border border-red-100">Keluar</button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw-O6UnXVW77Sy4W-pcqDCmgA3T-xU655X9hU7S58M3KOTaEiwZAvj5Zw1dTdhAac8t_w/exec";
    let currentUser = '', currentRole = '', latSekolah = 0, lonSekolah = 0, isInRadius = false, fotoBase64Data = '', statusSudahMasuk = false, statusSudahPulang = false, statusSudahIzin = false;

    async function callAPI(p) { try { let r = await fetch(API_URL, { method: "POST", body: JSON.stringify(p), headers: { "Content-Type": "text/plain;charset=utf-8" } }); return await r.json(); } catch (e) { alert("Koneksi gagal: " + e.message); return { success: false }; } }
    function setAtmosphere() { const hour = new Date().getHours(); const body = document.getElementById('main-body'); body.className = `min-h-screen font-sans py-10 px-4 transition-colors duration-1000 relative overflow-x-hidden ${hour>=4&&hour<15?'bg-blue-100':hour>=15&&hour<18?'bg-orange-100':'bg-slate-900'}`; }
    window.onload = function() { setAtmosphere(); const u = localStorage.getItem('dorkas_user'), p = localStorage.getItem('dorkas_pass'); if(u && p) { document.getElementById('log-user').value = u; document.getElementById('log-pass').value = p; document.getElementById('remember-me').checked = true; } };
    function togglePasswordVisibility() { const i = document.getElementById('log-pass'), t = document.getElementById('toggle-icon'); if(i.type === 'password') { i.type = 'text'; t.classList.replace('fa-eye-slash', 'fa-eye'); } else { i.type = 'password'; t.classList.replace('fa-eye', 'fa-eye-slash'); } }
    function showPage(p) { ['login-page', 'register-page', 'dashboard-page', 'admin-page'].forEach(id => document.getElementById(id).classList.toggle('hidden', id !== p)); const c = document.getElementById('app-container'); c.className = p === 'admin-page' ? "max-w-3xl mx-auto p-8 glass-gradient-top rounded-3xl shadow-2xl relative z-10 transition-all" : "max-w-md mx-auto p-8 glass-gradient-top rounded-3xl shadow-2xl relative z-10 transition-all"; }
    function toggleFormIzin() { document.getElementById('izin-content').classList.toggle('hidden'); document.getElementById('izin-icon').classList.toggle('rotate-180'); }

    async function doLogin() {
      const u = document.getElementById('log-user').value, p = document.getElementById('log-pass').value, rem = document.getElementById('remember-me').checked, btn = document.getElementById('btn-login-submit');
      if(!u || !p) return alert("Isi data login!");

      // Efek Loading
      const originalHTML = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Memproses...';
      btn.classList.add('opacity-80', 'cursor-not-allowed');

      let res = await callAPI({ action: 'login', username: u, password: p });

      if(res.success) {
        if(rem) { localStorage.setItem('dorkas_user', u); localStorage.setItem('dorkas_pass', p); }
        else { localStorage.removeItem('dorkas_user'); localStorage.removeItem('dorkas_pass'); }

        currentUser = res.nama;
        currentRole = res.role;
        statusSudahMasuk = res.sudahMasuk;
        statusSudahPulang = res.sudahPulang;
        statusSudahIzin = res.sudahIzin;

        if(window.AndroidInterface?.updateReminders) window.AndroidInterface.updateReminders(res.jadwal);

        if(currentRole === 'Admin') {
          showPage('admin-page');
          initAdminSettings();
        } else {
          document.getElementById('greeting').innerHTML = `Halo, ${currentUser}!`;
          renderTombolAbsen();
          showPage('dashboard-page');
          initCekGPS();
        }
      } else {
        alert(res.message);
        // Kembalikan tombol jika gagal
        btn.disabled = false;
        btn.innerHTML = originalHTML;
        btn.classList.remove('opacity-80', 'cursor-not-allowed');
      }
    }

    function renderTombolAbsen() {
      const bm = document.getElementById('btn-masuk'), bp = document.getElementById('btn-pulang'), bi = document.getElementById('btn-izin'), ki = document.getElementById('ket-izin');
      if(statusSudahIzin) { bm.disabled = bp.disabled = bi.disabled = ki.disabled = true; bm.innerText = "IZIN"; bp.innerText = "IZIN"; bi.innerText = "IZIN TERCATAT"; bm.className = bp.className = bi.className = "p-3 rounded-xl bg-gray-400 text-white font-bold cursor-not-allowed"; }
      else {
        bm.disabled = statusSudahMasuk; bm.innerText = statusSudahMasuk ? "SUDAH MASUK" : "MASUK"; bm.className = statusSudahMasuk ? "p-3 rounded-xl bg-gray-400 text-white font-bold" : "p-3 rounded-xl bg-blue-600 text-white font-bold";
        bp.disabled = statusSudahPulang; bp.innerText = statusSudahPulang ? "SUDAH PULANG" : "PULANG"; bp.className = statusSudahPulang ? "p-3 rounded-xl bg-gray-400 text-white font-bold" : "p-3 rounded-xl bg-orange-500 text-white font-bold";
        bi.disabled = statusSudahMasuk; bi.innerText = statusSudahMasuk ? "TIDAK BISA IZIN" : "Kirim Izin"; bi.className = statusSudahMasuk ? "w-full p-3 bg-gray-400 text-white font-bold" : "w-full p-3 bg-gray-700 text-white font-bold";
        bm.onclick = () => siapkanAbsen('Masuk'); bp.onclick = () => siapkanAbsen('Pulang');
      }
    }

    const H_MAP = { "1": "Senin", "2": "Selasa", "3": "Rabu", "4": "Kamis", "5": "Jumat", "6": "Sabtu" };
    async function initAdminSettings() {
      try {
        let res = await (await fetch(`${API_URL}?action=getSettings`)).json();
        document.getElementById('admin-lat').value = res.lat; document.getElementById('admin-lon').value = res.lon;
        const b = document.getElementById('jadwal-admin-body'); b.innerHTML = '';
        for(let i=1; i<=6; i++) {
          const [m, p] = (res.jadwal[i] || "06:55|15:00").split("|");
          b.innerHTML += `<tr><td class="p-2 border font-bold">${H_MAP[i]}</td><td class="p-2 border"><input type="time" id="m-${i}" value="${m}" class="w-full"></td><td class="p-2 border"><input type="time" id="p-${i}" value="${p}" class="w-full"></td></tr>`;
        }
      } catch(e) {}
    }

    async function simpanPengaturan() {
      let lat = document.getElementById('admin-lat').value, lon = document.getElementById('admin-lon').value, jad = {};
      for(let i=1; i<=6; i++) jad[i] = document.getElementById(`m-${i}`).value + "|" + document.getElementById(`p-${i}`).value;
      let res = await callAPI({ action: 'updateSettings', lat, lon, jadwalJson: JSON.stringify(jad) });
      alert(res.message); if(res.success && window.AndroidInterface?.updateReminders) window.AndroidInterface.updateReminders(JSON.stringify(jad));
    }

    async function lihatData() {
      const s = document.getElementById('filter-start').value, e = document.getElementById('filter-end').value;
      if(!s || !e) return alert("Pilih tanggal!");
      let res = await callAPI({ action: 'getFilteredAbsensi', startDate: s, endDate: e });
      ['siswa', 'kbtk', 'sd', 'smp'].forEach(t => renderTableHTML('tabel-'+t, res[t]));
      document.getElementById('data-preview-section').classList.remove('hidden'); document.getElementById('btn-download').classList.remove('hidden');
      currentStartDate = s; currentEndDate = e; cachedDataSiswa = res.siswa; cachedDataKBTK = res.kbtk; cachedDataSD = res.sd; cachedDataSMP = res.smp;
    }

    function renderTableHTML(id, data) {
      let h = '<table class="w-full text-left text-[10px] border-collapse">';
      if(!data || data.length <= 1) h += '<tr><td class="p-4 text-center italic">Kosong</td></tr>';
      else {
        h += '<thead class="bg-gray-100 uppercase"><tr>' + data[0].map(x => `<th class="p-2 border-b">${x}</th>`).join('') + '</tr></thead><tbody>';
        for(let i=1; i<data.length; i++) h += '<tr class="border-b">' + data[i].map((c, idx) => `<td class="p-2">${(idx===5||idx===6)&&c&&c!=='-' ? `<a href="${c}" target="_blank" class="text-blue-600 underline">Lihat</a>` : c}</td>`).join('') + '</tr>';
      }
      document.getElementById(id).innerHTML = h + '</table>';
    }

    function switchTab(id) { ['siswa', 'kbtk', 'sd', 'smp'].forEach(t => { document.getElementById('tab-btn-'+t).className = t===id ? "px-5 py-3 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 bg-white" : "px-5 py-3 text-sm font-bold text-gray-500 bg-gray-50"; document.getElementById('tabel-'+t).classList.toggle('hidden', t!==id); }); }
    function downloadExcel() { const wb = XLSX.utils.book_new(); ["Siswa","KBTK","SD","SMP"].forEach((n,i) => { let d = [cachedDataSiswa,cachedDataKBTK,cachedDataSD,cachedDataSMP][i]; if(d.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(d), n); }); const name = `Laporan_Absensi.xlsx`; if(window.AndroidInterface) window.AndroidInterface.downloadBlob(XLSX.write(wb, {bookType:'xlsx', type:'base64'}), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', 'filename=' + name); else XLSX.writeFile(wb, name); }
    function updateGpsUI(s, m) { document.getElementById('gps-status').innerText = m; document.getElementById('gps-box').className = `p-3 rounded-xl flex items-center gap-3 mb-6 ${s==='loading'?'bg-blue-50':s==='success'?'bg-green-50':'bg-red-50'}`; }
    async function initCekGPS() { updateGpsUI('loading', 'Cek GPS...'); try { let r = await (await fetch(`${API_URL}?action=getGps`)).json(); latSekolah = parseFloat(r.lat); lonSekolah = parseFloat(r.lon); if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p => { let d = hitungJarak(latSekolah, lonSekolah, p.coords.latitude, p.coords.longitude); isInRadius = d<=150; updateGpsUI(isInRadius?'success':'error', isInRadius?`Lokasi Valid (${Math.round(d)}m)`:`Diluar Radius (${Math.round(d)}m)`); }, () => updateGpsUI('error', 'GPS Mati'), {enableHighAccuracy:true}); } catch(e) {}}
    function hitungJarak(lat1, lon1, lat2, lon2) { const R = 6371e3, p1 = lat1*Math.PI/180, p2 = lat2*Math.PI/180, dp = (lat2-lat1)*Math.PI/180, dl = (lon2-lon1)*Math.PI/180, a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2; return R * (2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a))); }
    function siapkanAbsen(t) { if(!isInRadius) return alert("Diluar radius!"); tipeAbsenSekarang = t; document.getElementById('kamera-instruksi').innerText = `Absen ${t}`; document.getElementById('tombol-absen-box').classList.add('hidden'); document.getElementById('camera-box').classList.remove('hidden'); document.getElementById('foto-preview').classList.add('hidden'); document.getElementById('btn-snap').classList.add('hidden'); }
    function previewFoto(e) { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = x => { fotoBase64Data = x.target.result; document.getElementById('foto-preview').src = x.target.result; document.getElementById('foto-preview').classList.remove('hidden'); document.getElementById('btn-snap').classList.remove('hidden'); }; r.readAsDataURL(f); }
    function batalAbsen() { document.getElementById('camera-box').classList.add('hidden'); document.getElementById('tombol-absen-box').classList.remove('hidden'); }
    async function simpanAbsen() { updateGpsUI('loading', 'Menyimpan...'); let res = await callAPI({ action: 'absen', tipe: tipeAbsenSekarang, nama: currentUser, keterangan: 'Hadir', fotoBase64: fotoBase64Data }); alert(res.message); if(res.success) { if(tipeAbsenSekarang==='Masuk') { statusSudahMasuk = true; if(window.AndroidInterface?.markAsClockedIn) window.AndroidInterface.markAsClockedIn(); } else statusSudahPulang = true; renderTombolAbsen(); } batalAbsen(); initCekGPS(); }
    async function kirimIzin() { const k = document.getElementById('ket-izin').value; if(!k) return alert("Isi alasan!"); let res = await callAPI({ action: 'absen', tipe: 'Izin', nama: currentUser, keterangan: k, fotoBase64: null }); alert(res.message); if(res.success) { statusSudahIzin = statusSudahMasuk = statusSudahPulang = true; if(window.AndroidInterface?.markAsClockedIn) window.AndroidInterface.markAsClockedIn(); renderTombolAbsen(); } toggleFormIzin(); }
    function logout() { localStorage.removeItem('dorkas_user'); localStorage.removeItem('dorkas_pass'); showPage('login-page'); }
  </script>
